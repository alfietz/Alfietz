name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Key fingerprint
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          len=${#KEY}
          hash=$(printf '%s' "$KEY" | sha256sum | cut -c1-12)
          body="OPENCODE_API_KEY length=${len} sha256_prefix=${hash}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "{\"body\":\"${body}\"}"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          use_github_token: true
          prompt: |
            Review this pull request for the Alfietz Vue 3 + Vite marketplace.
            Focus on:
            - Correctness and regressions in Vue components, router, and state in src/App.vue
            - Security: never expose TURSO_AUTH_TOKEN, APP_API_KEY, or other secrets to the client;
              all database access must go through api/db.js
            - SQL safety in api/db.js and scripts/ (parameterized queries, no string interpolation)
            - Vercel serverless compatibility (no long-lived connections, proper response handling)
            - Build or import errors that would break `npm run build`
            Report only actionable findings with file and line references. Do not comment if there is nothing worth changing.
