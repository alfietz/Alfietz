name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_d47ae6a9-b100-4bdd-8d74-f2240c6515d6 \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          use_github_token: true
          prompt: |
            Review this pull request for the Alfietz Vue 3 + Vite marketplace.
            Focus on:
            - Correctness and regressions in Vue components, router, and state in src/App.vue
            - Security: never expose TURSO_AUTH_TOKEN, APP_API_KEY, or other secrets to the client;
              all database access must go through api/db.js
            - SQL safety in api/db.js and scripts/ (parameterized queries, no string interpolation)
            - Vercel serverless compatibility (no long-lived connections, proper response handling)
            - Build or import errors that would break `npm run build`
            Report only actionable findings with file and line references. Do not comment if there is nothing worth changing.
